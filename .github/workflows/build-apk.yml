
name: Build APK Jadwal Shalat

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 8
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Android SDK packages
      # Jangan tambahkan paket "tools" karena sudah tidak tersedia
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-28" \
            "build-tools;28.0.3"

      # 5. Find Android project ZIP
      - name: Find Android project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP project Android tidak ditemukan."
            echo "Daftar file repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 6. Extract Android project
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "Isi hasil ekstraksi:"
          find android-project -maxdepth 4 -type f | sort | head -n 100

      # 7. Find Android project folder
      - name: Find Android project folder
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "android-project/settings.gradle" ]; then
            PROJECT_DIR="android-project"
          else
            PROJECT_DIR=$(find android-project \
              -name "settings.gradle" \
              -not -path "*/.git/*" \
              -print -quit \
              | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            find android-project -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Folder project Android: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 8. Setup Gradle 5.6.4
      - name: Setup Gradle 5.6.4
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '5.6.4'

      # 9. Check Java, Gradle, and Android SDK
      - name: Check Java, Gradle, and Android SDK
        shell: bash
        run: |
          set -e

          java -version
          gradle --version
          sdkmanager --list_installed || true

      # 10. Build APK
      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # 11. Find generated APK
      - name: Find generated APK
        id: find_apk
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK tidak ditemukan."
            find "$PROJECT_DIR" -type f | grep -i apk || true
            exit 1
          fi

          echo "APK ditemukan: $APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jadwal-shalat-launcher-debug
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      # 13. Build summary
      - name: Build summary
        if: success()
        shell: bash
        run: |
          echo "======================================"
          echo "BUILD APK BERHASIL"
          echo "======================================"
          echo "APK: $APK_FILE"
