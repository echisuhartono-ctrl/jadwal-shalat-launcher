
name: Build APK Jadwal Shalat

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17 untuk Android SDK dan sdkmanager
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      # Jangan menambahkan paket "tools"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-28
            build-tools;28.0.3

      # 4. Install paket SDK secara eksplisit
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-28" \
            "build-tools;28.0.3"

      # 5. Cari file ZIP project Android
      - name: Find Android project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          echo "Daftar file ZIP:"
          find . -type f -name "*.zip" -print

          ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP project Android tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 6. Ekstrak project Android
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "Isi hasil ekstraksi:"
          find android-project -maxdepth 4 -type f | head -n 100

      # 7. Cari folder project yang berisi settings.gradle
      - name: Find Android project folder
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "android-project/settings.gradle" ]; then
            PROJECT_DIR="android-project"
          else
            SETTINGS_FILE=$(find android-project \
              -type f \
              -name "settings.gradle" \
              -not -path "*/.git/*" \
              | head -n 1)

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            find android-project -type f -maxdepth 6
            exit 1
          fi

          echo "Folder project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 8. Java 8 untuk Gradle dan Android Gradle Plugin lama
      - name: Setup Java 8 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # 9. Install Gradle 5.6.4
      - name: Setup Gradle 5.6.4
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="5.6.4"
          GRADLE_DIR="$HOME/gradle-$GRADLE_VERSION"

          if [ ! -d "$GRADLE_DIR" ]; then
            wget -q \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -O "$HOME/gradle.zip"

            unzip -q "$HOME/gradle.zip" -d "$HOME"
          fi

          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

          export PATH="$GRADLE_DIR/bin:$PATH"

          gradle --version

      # 10. Periksa Java dan Gradle
      - name: Check Java and Gradle
        shell: bash
        run: |
          java -version
          gradle --version

      # 11. Build APK
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Mulai build APK..."
          echo "Folder project: $(pwd)"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      # 12. Cari APK hasil build
      - name: Find generated APK
        id: find_apk
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK tidak ditemukan."
            find "$PROJECT_DIR" -type f | grep -E "\.(apk|aab)$" || true
            exit 1
          fi

          echo "APK ditemukan: $APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      # 13. Upload APK sebagai artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jadwal-shalat-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      # 14. Informasi selesai
      - name: Build summary
        shell: bash
        run: |
          echo "======================================"
          echo "BUILD APK BERHASIL"
          echo "======================================"
          echo "File APK: $APK_FILE"
