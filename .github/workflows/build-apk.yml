
name: Build APK Jadwal Shalat

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-28" "build-tools;28.0.3"

      - name: Extract Android project
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "File ZIP project tidak ditemukan"
            exit 1
          fi

          echo "Menggunakan file: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Find Android project
        run: |
          SETTINGS_FILE=$(find extracted -name "settings.gradle" -type f | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle tidak ditemukan"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project ditemukan di: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --version
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jadwal-shalat-launcher-apk
          path: |
            extracted/**/*.apk
