
name: Build APK Jadwal Shalat

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java 17 wajib dipasang sebelum Android SDK
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Setup Android SDK tanpa sdkmanager tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Install hanya package yang dibutuhkan
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-28" \
            "build-tools;28.0.3"

      # Cari ZIP project Android
      - name: Find Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 5 \
            -type f \
            -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project Android tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # Ekstrak project
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          find android-project -maxdepth 4 -type f | head -n 100

      # Cari settings.gradle
      - name: Find Android project folder
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find android-project \
            -type f \
            -name "settings.gradle" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Project Android: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # Java 8 untuk Gradle lama
      - name: Setup Java 8 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # Download Gradle 5.6.4
      - name: Setup Gradle 5.6.4
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-5.6.4-bin.zip \
            -O "$HOME/gradle.zip"

          unzip -q "$HOME/gradle.zip" -d "$HOME"

          "$HOME/gradle-5.6.4/bin/gradle" --version

      # Build APK
      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          "$HOME/gradle-5.6.4/bin/gradle" \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # Cari APK
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan: $APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jadwal-shalat-launcher-debug
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
